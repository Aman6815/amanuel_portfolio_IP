     thank-you.html — page that opens after the contact form is sent (Lab 9)
     Labs covered: 8 semantic structure and metadata, 9 contact form basics, 10 POST
     ============================================================ -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Amanuel Alemayehu</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <meta name="description" content="Confirmation page after sending a message to Amanuel Alemayehu, Software Engineering student at AASTU.">
    <meta name="keywords" content="Amanuel Alemayehu, thank you, contact, portfolio">
    <meta name="author" content="Amanuel Alemayehu">
    <style>
        :root { --ink: #172033; --muted: #526078; --accent: #155eef; --bg: #f5f7fb; --card: #fff; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, Helvetica, sans-serif; line-height: 1.65; color: var(--ink); background: var(--bg); }
        header { background: #10213f; color: white; padding: 1.2rem 1rem; }
        nav, main, footer { max-width: 950px; margin: auto; }
        nav { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; }
        nav .brand { margin-right: auto; font-weight: bold; }
        nav a { color: white; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        main { padding: 1.5rem 1rem 3rem; }
        .message { background: var(--card); padding: 1.4rem; margin: 1rem 0; border-radius: 12px; box-shadow: 0 3px 14px #15294b0c; }
        h1 { line-height: 1.2; color: #10213f; }
        a { color: var(--accent); }
        footer { padding: 1rem; color: var(--muted); text-align: center; }
    </style>
</head>
<body>
    <!-- HEADER with the menu: the same pattern as the other pages (Lab 8) -->
    <header>
        <nav aria-label="Main navigation">
            <a class="brand" href="index.html">Amanuel Alemayehu</a>
            <a href="index.html">Home</a>
            <a href="projects.html">Projects</a>
            <a href="index.html#contact">Contact</a>
        </nav>
    </header>

    <main>
        <section class="message">
            <h1>Thank you!</h1>
            <p>Your message has been sent. I will reply within two days.</p>
            <!-- Lab 10: the form now uses method="post", so the data travels inside the request, not in the URL -->
            <p>Your message was sent with POST, so it is not shown in the URL.</p>
            <p><a href="index.html">← Back to Home</a></p>
        </section>
    </main>

    <footer>
        <p>© 2026 Amanuel Alemayehu</p>
    </footer>
</body>
</html>
